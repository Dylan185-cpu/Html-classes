<!DOCTYPE html>
<html>
    <body>
        <h2>Convert a javaScript object into a JSON string, and send it so the server</h2>

        <p id="result"></p>


        <br><br>

        <h1>JavaScript async / await</h1>

        <h3 id="result1"></h3>



        <br><br>


        <h4>JavaScript Promise</h4>

        <p id="demo"></p>

        <script>
            var myObj = { name: "Riya", age: 12, grade: 7};

            var myJSON = JSON.stringify(myObj); // converts object to JSON for sending data

            var newObj = JSON.parse(myJSON); // converts JSON into object while receiving data

            document.getElementById("result").innerHTML = newObj.name;


            async function add (a, b){
                let respone = await a + b;
                display(respone);
            }

            function display(some){
                document.getElementById("result1").innerHTML = some;
            }

            add(5, 20);


            function myDisplayer(some){
                document.getElementById("demo").innerHTML = some;
            }

            function sum(a,b){
                var sum = a + b;
                myDisplayer(sum)
            }

            let myPromise = new Promise(function(myResolve, myReject) {
                let x = 0; // some code (try to change x to 5)

                if (x==0) {
                    myReslove("OK"); // when successful
                } else {
                    myReject("Error"); // when error
                }
            });

            // consuming code - must wait for fulfilled promise
            myPromise.then(
                function(value) { sum(5,5);}, // code is successful
                function(error) { sum(error);} // code is error
            )
        </script>
    </body>
</html>
