<!DOCTYPE html>
<body>
    <h2>JavaScript Arrays</h2>

    <p id="demo"></p>

    <br><br>

    <h1>JavaScript Array Methods</h1>
    <h3>join() and pop()</h3>
    <p>The join() method joins array elements into a string and the pop() method removes
        the last element from an array
    </p>
    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>

    <br><br>

    <h4>JavaScript Functions</h4>
    <p>Do a calculation and then display the results</p>
    <p id="demo1"></p>

    <script>
        var cars = [
            "coding",
            "Magic",
            "Learn"
        ];
        document.getElementById("demo").innerHTML = cars[2];

        var fruits =  ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("myjoin").innerHTML = fruits.join(" * ");
        document.getElementById("myfirstpop").innerHTML = fruits;
        fruits.pop();
        document.getElementById("mysecondpop").innerHTML = fruits;

        function add(a, b) {
            return a + b;
        }
        function average(a, b) {
            return add(a, b) / 2;
        }
        let result = average(10, 20);
        document.getElementById("demo1").innerHTML = result;
    </script>



</body>
