<!DOCTYPE html>
<html>
    <head>
        <style>
            *{
                text-align: center;
                font-family: monospace;
            }
            #text{
                text-shadow: 2px 2px 1px aquamarine;
            }
            #box{
                box-shadow: 9px 9px 5px firebrick;
            }
            #indent{
                text-indent: 50%;
            }
        </style>
    </head>
    <body>
        <h1 id="text">We can use text shadow to text itself</h1>
        <h1 id="box">Or use box shadow to give shadow to element</h1>

        <div>
            <p>this is an example of text-indent</p>
            <p id="indent">This is an examplw of text-indent</p>
        </div>
    </body>
</html>
