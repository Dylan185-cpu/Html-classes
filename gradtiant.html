<!DOCTYPE html>
<html>
    <head>
        <style>
            #grad1{
                height: 200px;
                background: linear-gradient(aqua,rgb(107, 139, 0))
            }
            #grad2{
            height: 200px;
                background: linear-gradient(to bottom,pink,cyan);
            }
            #grad3{
                height: 200px;

            }
        </style>
    </head>
    <body>
        <div id="grad1">
            gradient 1
        </div><br>
        <div id="grad2">
            gradient 2
        </div>
        <div id="grad3">
            gradient 3
        </div>
    </body>
</html>
