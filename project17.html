<!DOCTYPE html>
<html>
<head>
  <title>Counter App</title>
</head>
<body>

  <button onclick="decrement()">Decrement</button>
  <button onclick="resetCounter()">Reset</button>

  <script>
    let count = 0;

    function updateDisplay() {
      document.getElementById("count").innerText = count;
    }

    function decrement() {
      count--;
      updateDisplay();
    }

    function resetCounter() {
      count = 0;
      updateDisplay();
    }
  </script>

</body>
</html>
