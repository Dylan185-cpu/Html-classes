            }

        <h1>Float Right</h1>
        <p>In this example, the image will float to the right paragraph, and this text in the paragraph will wrap around the image</p>

            <img id="flowerLeft" src="https://www.kindpng.com/picc/m/257-2575509_simple-flower-clip-art-at-clker-simple-flower.png" alt="tree" style="width:100px;height:100px">

        </p>
    </body>
</html>
