<!DOCTYPE html>
<html>
    <body>

        <p id="demo1"></p>
        <script>
             var day;
    switch (new Date().getDay()) {
        case 0:
            day = "march 1";
            break;
        case 1:
            day = "march 2";
            break;
        case 2:
            day = "march 3";
            break;
        case 3:
            day = "march 4";
            break;
        case 4:
            day = "march 5";
            break;
        case 5:
            day = "march 6";
            break;
        case 6:
            day = "march 7";
    }
    document.getElementById("demo1").innerHTML = "Today is" + day;

        </script>
    </body>
</html>
