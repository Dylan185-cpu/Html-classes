<!DOCTYPE html>
<html>
    <body>
        <h1>Addtion Multiply Subtraction</h1>
        <p id="result1"></p>
        <script>
            function myFunction() {
                var x = 30;
                var y = 100;

                var a = eval("x + y") + "<br>";
                var b = eval("2 * 2") + "<br>";
                var c = eval("y - x") + "<br>";

                var res = a + b + c; // concatenates the string

                document.getElementById("result1").innerHTML = res;
                }
        </script>
    </body>
</html>
